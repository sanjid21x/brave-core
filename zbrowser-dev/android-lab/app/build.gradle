plugins { id 'com.android.application' }
android {
    namespace 'com.sanjid.browser.torrent'
    compileSdk 36
    defaultConfig {
        applicationId 'com.sanjid.browser.lab'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { resources { excludes += ['META-INF/LICENSE*','META-INF/NOTICE*','META-INF/DEPENDENCIES'] } }
}
dependencies {
    implementation "com.frostwire:jlibtorrent-android:2.1.2.1@aar"
}
